<div class="feed-container max-w-2xl mx-auto px-4 py-6 space-y-4">

    <!-- Create post widget -->
    <div class="mb-6">
        <app-create-post (postCreated)="onPostCreated($event)" />
    </div>

    <!-- Loading skeleton (initial) -->
    @if (loading() && posts().length === 0) {
    <app-loader text="Đang tải bảng tin..." />
    }

    <!-- Post list -->
    <div class="space-y-5">
        @for (post of posts(); track post.id) {
        <app-post-card [post]="post" (upvote)="onUpvote($event)" (downvote)="onDownvote($event)" (save)="onSave($event)"
            (share)="onShare($event)" />
        }
    </div>

    <!-- Empty state -->
    @if (!loading() && posts().length === 0) {
    <div class="text-center py-16 text-slate-500">
        <div class="text-5xl mb-4">📭</div>
        <h3 class="text-white font-semibold mb-1">Chưa có bài viết nào</h3>
        <p class="text-sm">Hãy theo dõi người dùng khác hoặc đăng bài đầu tiên!</p>
    </div>
    }

    <!-- Load more -->
    @if (posts().length > 0 && !loading()) {
    <div class="flex justify-center pt-2">
        <button (click)="loadMore()"
            class="px-6 py-2.5 text-sm text-slate-300 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition-colors">
            Tải thêm bài viết
        </button>
    </div>
    }

    <!-- Loading more -->
    @if (loading() && posts().length > 0) {
    <app-loader text="Đang tải thêm..." />
    }

</div>
